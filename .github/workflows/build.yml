name: Build ryzennc

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build panel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Type check (non-blocking)
        run: npm run lint
        continue-on-error: true

      - name: Build (vite + server bundle)
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/server.cjs
          test -f dist/index.html
          ls -la dist

      - name: Package release archive
        run: |
          tar -czf ryzennc-dist.tar.gz \
            dist public package.json package-lock.json \
            ecosystem.config.cjs .env.example install.sh update.sh uninstall.sh README.md
          ls -lh ryzennc-dist.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: ryzennc-dist
          path: ryzennc-dist.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ryzennc-dist
      - uses: softprops/action-gh-release@v2
        with:
          files: ryzennc-dist.tar.gz
          generate_release_notes: true

  docker:
    name: Build & push Docker image (GHCR)
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
